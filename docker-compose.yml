version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deepguard-backend
    ports:
      - "8000:8000"
    environment:
      - MODEL_PROVIDER=huggingface
      - HF_MODEL_ID=dima806/deepfake_vs_real_image_detection
      - DEVICE=cpu
      - DATABASE_URL=sqlite:///./deepguard.db
    volumes:
      - ./storage:/app/storage
      - ./checkpoints:/app/checkpoints
    restart: unless-stopped
